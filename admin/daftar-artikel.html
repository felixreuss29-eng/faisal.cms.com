<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="#b91c1c" />
  <link rel="icon" href="../assets/img/favicon.ico?v=30" />
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/img/favicon.png?v=30" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png?v=30" />
  <link rel="manifest" href="../site.webmanifest?v=30" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Daftar Artikel — Faisal CMS</title>
  <meta name="description" content="Daftar dan status artikel di Faisal CMS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css?v=71" />
</head>
<body data-admin="1">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <span class="brand-name">Faisal CMS</span>
      <nav aria-label="Navigasi admin">
        <a href="dasbor.html">▦ Dasbor</a><a class="active" href="daftar-artikel.html">▤ Artikel</a><a href="editor.html">✎ Editor</a>
        <a href="posting.html">↑ Tulis Postingan</a><a href="../">← Lihat situs</a>
      </nav>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar"><button class="icon-btn" type="button" data-sidebar-toggle aria-label="Ciutkan sidebar" aria-expanded="true">☰</button><h1>Daftar Artikel</h1><div class="spacer"></div><a class="btn btn-outline" href="posting.html">+ Artikel baru</a></header>
      <main class="admin-content">
        <nav class="breadcrumb" aria-label="Breadcrumb">Admin › Artikel</nav>
        <div class="filter-bar" style="border:0;padding-top:0"><button class="chip active" type="button" data-status-filter="Semua">Semua</button><button class="chip" type="button" data-status-filter="Draf">Draf</button><button class="chip" type="button" data-status-filter="Review">Review</button><button class="chip" type="button" data-status-filter="Disetujui">Disetujui</button><button class="chip" type="button" data-status-filter="Terbit">Terbit</button><button class="chip" type="button" data-status-filter="Ditolak">Ditolak</button></div>
        <section class="admin-card" style="margin-top:0">
          <table>
            <thead><tr><th scope="col">Judul</th><th scope="col">Kategori</th><th scope="col">Penulis</th><th scope="col">Status</th><th scope="col">Dilihat</th><th scope="col">Diperbarui</th><th scope="col"><span class="sr-only">Aksi</span></th></tr></thead>
            <tbody id="daftar-artikel-rows"><tr><td colspan="7" class="meta">Memuat postingan…</td></tr></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="../assets/js/supabase-config.js?v=71"></script>
  <script src="../assets/js/config.js?v=71"></script>
  <script src="../assets/js/supabase.js?v=71"></script>
  <script src="../assets/js/data.js?v=71"></script><script src="../assets/js/app.js?v=71"></script>
  <script>
  (async function () {
    const wadah = document.getElementById('daftar-artikel-rows');
    try {
      const r = await fetch('../assets/js/posts.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const daftar = Array.isArray(data.posts) ? data.posts : [];
      wadah.innerHTML = daftar.length ? daftar.map((p) => `<tr data-status="Terbit">
        <td>${String(p.title || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))}</td>
        <td>${String(p.category || '')}</td><td>Faisal Akbar</td>
        <td><span class="badge published">Terbit</span></td>
        <td><span class="meta" data-view="${encodeURIComponent(p.id)}">—</span></td>
        <td><span data-relative="${String(p.updated || p.published || '')}"></span></td>
        <td><a class="kicker" href="../artikel/${encodeURIComponent(p.id)}/">Lihat</a></td>
      </tr>`).join('') : '<tr><td colspan="7" class="meta">Belum ada postingan. Unggah melalui menu Tulis Postingan.</td></tr>';
      if (typeof window.updateDynamicTime === 'function') window.updateDynamicTime();
      if (window.FaisalData && typeof window.FaisalData.ringkasan === 'function') window.FaisalData.ringkasan().catch(() => {});
    } catch (e) {
      wadah.innerHTML = '<tr><td colspan="7" class="meta">Daftar artikel tidak dapat dimuat: ' + e.message + '</td></tr>';
    }
  })();
  </script>
</body>
</html>
